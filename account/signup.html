<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/account.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <script src="../assets/js/theme.js"></script>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.98.0/dist/umd/supabase.js" integrity="sha384-NRo2jhGGHu91p1IOcVC3UWI5Vnd+xGXfD/8N7Hr9+aGTK0d/Pl0i+kUZsB/zIlrK" crossorigin="anonymous" defer></script>
  <script src="../assets/js/config.js" defer></script>
  <script src="../assets/js/common.js" defer></script>
  <script src="../assets/js/security.js" defer></script>
  <script src="../assets/js/galaxy-bg.js" defer></script>
  <script src="../assets/js/cursor-lighting.js" defer></script>
  <script src="../assets/js/creative.js" defer></script>
  <script src="../assets/js/pages/signup.js" defer></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2383b5d1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10' stroke-dasharray='4 2'/><circle cx='12' cy='12' r='6' stroke='%23ffffff' stroke-width='1' opacity='0.5'/><polyline points='12 6 12 12 16 14' stroke='%23ffffff'/><circle cx='12' cy='12' r='1.5' fill='%23eec643'/></svg>">

</head>
<body>
  <button class="theme-toggle theme-toggle-fixed" type="button" aria-label="Toggle theme"></button>
  <form class="signup-form" id="signup-form">
    <h2>Create Account</h2>
    <label>Username:</label>
    <input type="text" id="username" name="name" required minlength="3" maxlength="50" pattern="^[a-zA-Z0-9_]+$" title="Usernames can only contain letters, numbers, and underscores (3-50 chars).">

    <label>Email:</label>
    <input type="email" id="email" name="email" required>

    <label>Password:</label>
    <input type="password" id="password" name="password" required>
    
    <label>Confirm Password:</label>
    <input type="password" id="confirm-password" name="confirm-password" required>
    
    <div id="message" style="margin: 10px 0; text-align: center; font-weight: bold; font-size: 14px;"></div>

    <a href="login.html" id="a_style">Already got an account? Log in here</a>
    <button type="submit">Create Account</button>
  </form>
</body>
</html>
