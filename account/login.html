<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="account.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <script src="../assets/js/theme.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f97316' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10' stroke-dasharray='4 2'/><circle cx='12' cy='12' r='6' stroke='%23ffffff' stroke-width='1' opacity='0.5'/><polyline points='12 6 12 12 16 14' stroke='%23ffffff'/><circle cx='12' cy='12' r='1.5' fill='%23f97316'/></svg>">

  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.98.0/dist/umd/supabase.js" integrity="sha384-NRo2jhGGHu91p1IOcVC3UWI5Vnd+xGXfD/8N7Hr9+aGTK0d/Pl0i+kUZsB/zIlrK" crossorigin="anonymous" defer></script>
  <script src="../assets/js/config.js" defer></script>
  <script src="../assets/js/galaxy-bg.js" defer></script>
  <script src="../assets/js/cursor-lighting.js" defer></script>
  <script src="../assets/js/creative.js" defer></script>
  <script src="login.js" defer></script>
  
</head>
<body>
  <button class="theme-toggle theme-toggle-fixed" type="button" aria-label="Toggle theme"></button>
  <form class="signup-form" id="login-form">
    <h2>Login</h2>
    <label>Email:</label>
    <input type="email" id="email" name="email" required>

    <label>Password:</label>
    <input type="password" id="password" name="password" required>
    
    <div id="message" style="margin: 10px 0; text-align: center; font-weight: bold; font-size: 14px;"></div>

    <a href="signup.html">Don't have an account? Create one here</a>
    <button type="submit">Login</button>
  </form>
</body>
</html>
